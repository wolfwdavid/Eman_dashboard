#cloud-config
# First-boot setup for the DID agent on an Oracle Cloud Always Free ARM VM (Ubuntu 24.04 aarch64).
# Installs Docker + Ollama, pulls the local model, opens 80/443 on the host firewall, clones the repo.
# After this finishes, deploy/oracle/deploy.sh (run from the laptop) copies .env and starts the stack.
package_update: true
package_upgrade: false
packages:
  - git
  - curl
  - ca-certificates
  - netfilter-persistent
  - iptables-persistent

runcmd:
  # Docker (official convenience script, arm64 aware)
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ubuntu
  # Ollama on the host, listening on 127.0.0.1:11434 (systemd service). Container reaches it via host networking.
  - curl -fsSL https://ollama.com/install.sh | sh
  - systemctl enable --now ollama
  - for i in $(seq 1 30); do curl -sf localhost:11434/api/version && break; sleep 3; done
  - ollama pull llama3.2:3b
  # Oracle's Ubuntu image ships an iptables policy that drops everything but 22; open web ports for Caddy.
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - netfilter-persistent save
  # Agent code (public repo). Secrets arrive later via scp as /opt/did-agent/agent/.env.
  - git clone https://github.com/wolfwdavid/Eman_dashboard.git /opt/did-agent
  - chown -R ubuntu:ubuntu /opt/did-agent
  - touch /var/lib/cloud/did-agent-ready
